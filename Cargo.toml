[package]
name = "h264_glitcher"
version = "0.1.0"
authors = ["Anton Schirg <anton.schirg@posteo.de>"]
edition = "2018"
default-run = "h264_glitcher"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["web_server"]
validator = ["dep:visit_diff", "dep:colored" ]
web_server = ["dep:axum", "dep:tokio", "dep:tower-http"]
push2 = ["dep:push2_display", "dep:midir", "dep:anyhow", "dep:embedded-graphics"]

[[bin]]
name = "h264_glitcher"

[[bin]]
name = "inspect_video"

[[bin]]
name = "validate_video_parameters"
required-features = ["validator"]

[[bin]]
name = "read_mp4"

[dependencies]
pipe = "0.4.0"
enum_primitive = "0.1.1"
structopt = "0.3"
rosc = "0.10"
itertools = "0.10"
spin_sleep = "1"
bitstream-io = "1"
walkdir = "*"

# Web Server
axum = { version = "0.8", features = ["tokio", "http1", "ws"], optional = true }
tokio = { version = "1", features = ["net", "rt-multi-thread"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

# For video player
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
glow = "0.13"
glutin = { version = "0.31", default-features = false, features = ["egl", "x11"] }
winit = "0.29"
raw-window-handle = "0.5"
glutin-winit = "0.4"
png = "0.17"

# Push 2
push2_display = { version = "0.2", optional=true }
midir = { version = "0.10", optional=true }
anyhow = { version = "1.0", optional=true }
embedded-graphics = { version = "0.7", optional=true }

# validator
visit_diff = { version = "0.1", optional = true }
colored = { version = "2", optional = true }
